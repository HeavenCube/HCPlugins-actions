name: Setup Java and Gradle
description: Configure the JDK and Gradle cache for HCPlugins repositories.

inputs:
  java-version:
    description: JDK version used by the build.
    required: false
    default: "25"
  distribution:
    description: setup-java distribution.
    required: false
    default: temurin
  cache-encryption-key:
    description: Optional AES key for persisting the Gradle configuration cache between runs.
    required: false
  protect-private-source:
    description: Keep only downloaded dependencies and wrapper distributions in the public Gradle User Home cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        gradle-home-cache-includes: |
          ${{ inputs.protect-private-source == 'true' && 'caches/modules-2' || 'caches' }}
          notifications
        # Enhanced caching also extracts these groups independently of the include list.
        gradle-home-cache-excludes: |
          ${{ inputs.protect-private-source == 'true' && 'caches/build-cache-*' || '' }}
          ${{ inputs.protect-private-source == 'true' && 'caches/*/kotlin-dsl/**' || '' }}
          ${{ inputs.protect-private-source == 'true' && 'caches/*/groovy-dsl/**' || '' }}
          ${{ inputs.protect-private-source == 'true' && 'caches/*/transforms/**' || '' }}
          ${{ inputs.protect-private-source == 'true' && 'caches/transforms-*/**' || '' }}
          ${{ inputs.protect-private-source == 'true' && 'caches/jars-*/**' || '' }}

    - name: Check configuration cache eligibility
      id: configuration-cache
      shell: bash
      env:
        CACHE_ENCRYPTION_KEY: ${{ inputs.cache-encryption-key }}
      run: |
        set -euo pipefail
        echo "enabled=false" >> "${GITHUB_OUTPUT}"
        wrapper=gradle/wrapper/gradle-wrapper.properties
        if [[ -z "${CACHE_ENCRYPTION_KEY}" || ! -f "${wrapper}" ]]; then
          exit 0
        fi
        wrapper_url=$(sed -n 's/^distributionUrl=//p' "${wrapper}")
        wrapper_url="${wrapper_url%$'\r'}"
        # Persist only the encrypted project cache produced by supported release wrappers.
        if [[ "${wrapper_url}" =~ /gradle-([0-9]+)\.([0-9]+)(\.[0-9]+)?-(bin|all)\.zip$ ]] &&
           (( BASH_REMATCH[1] > 9 || (BASH_REMATCH[1] == 9 && BASH_REMATCH[2] >= 8) )); then
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: Cache Gradle configuration
      if: ${{ steps.configuration-cache.outputs.enabled == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .gradle/configuration-cache
        key: hcplugins-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.distribution }}-${{ inputs.java-version }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml', '.hcplugins/**/*.gradle*', '.hcplugins/**/gradle.properties', '.hcplugins/**/gradle-wrapper.properties', '.hcplugins/**/*.versions.toml') }}-${{ github.sha }}
        restore-keys: |
          hcplugins-configuration-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.distribution }}-${{ inputs.java-version }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml', '.hcplugins/**/*.gradle*', '.hcplugins/**/gradle.properties', '.hcplugins/**/gradle-wrapper.properties', '.hcplugins/**/*.versions.toml') }}-
