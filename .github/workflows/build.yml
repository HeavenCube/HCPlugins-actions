name: Reusable Gradle Build

on:
  workflow_call:
    inputs:
      project-name:
        description: Human-readable project name used for artifacts and releases.
        required: true
        type: string
      java-version:
        description: JDK version.
        required: false
        default: "25"
        type: string
      gradle-task:
        description: Gradle task or task list to execute.
        required: false
        default: build
        type: string
      gradle-arguments:
        description: Extra Gradle arguments.
        required: false
        default: --stacktrace
        type: string
      artifact-path:
        description: Path or multiline glob to upload. Empty disables artifact upload.
        required: false
        default: ""
        type: string
      artifact-name:
        description: Optional Actions artifact name.
        required: false
        default: ""
        type: string
      retention-days:
        description: Actions artifact retention in days.
        required: false
        default: 14
        type: number
      core-source:
        description: Checkout the current HCPlugins-Core main sources for a Gradle composite build.
        required: false
        default: false
        type: boolean
      source-repositories:
        description: Public GitHub owner/repository names, one per line, cloned from main into .hcplugins/repository.
        required: false
        default: ""
        type: string
      create-release:
        description: Create an incrementing GitHub release for successful builds of release-branch.
        required: false
        default: true
        type: boolean
      release-branch:
        description: Branch whose successful builds create releases.
        required: false
        default: main
        type: string
      release-tag-prefix:
        description: Prefix used for incrementing release tags, for example v -> v1, v2, v3.
        required: false
        default: v
        type: string
      release-assets:
        description: Optional multiline asset paths/globs. Empty reuses artifact-path.
        required: false
        default: ""
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        description: Optional AES key for persisting the Gradle configuration cache between runs.
        required: false
    outputs:
      release-version:
        description: Numeric version generated for this build, empty for non-release builds.
        value: ${{ jobs.build.outputs.release-version }}
      release-tag:
        description: Release tag generated for this build, empty for non-release builds.
        value: ${{ jobs.build.outputs.release-tag }}

permissions:
  contents: write

jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          ((github.event_name != 'push' || !contains(github.event.head_commit.message, '[ci-skip]')) &&
           (github.event_name != 'pull_request' ||
            (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[ci-skip]')))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: hcplugins-build-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      release-version: ${{ steps.release-version.outputs.version }}
      release-tag: ${{ steps.release-version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Checkout Core main
        if: ${{ inputs.core-source }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HeavenCube/HCPlugins-Core
          ref: main
          path: .hcplugins/HCPlugins-Core
          persist-credentials: false

      - name: Checkout additional source builds
        if: ${{ inputs.source-repositories != '' }}
        shell: bash
        env:
          SOURCE_REPOSITORIES: ${{ inputs.source-repositories }}
        run: |
          set -euo pipefail
          while IFS= read -r repository; do
            [[ -z "${repository}" ]] && continue
            if [[ ! "${repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::Invalid source repository: ${repository}"
              exit 1
            fi
            target=".hcplugins/${repository##*/}"
            if [[ -e "${target}" ]]; then
              echo "::error::Source checkout path already exists: ${target}"
              exit 1
            fi
            git clone --quiet --depth 1 --branch main "https://github.com/${repository}.git" "${target}"
          done <<< "${SOURCE_REPOSITORIES}"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve release version
        id: release-version
        if: ${{ inputs.create-release && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', inputs.release-branch) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.release-tag-prefix }}
        run: |
          set -euo pipefail

          highest=0
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            if [[ "${tag}" == "${TAG_PREFIX}"* ]]; then
              number="${tag#"${TAG_PREFIX}"}"
              if [[ "${number}" =~ ^[0-9]+$ ]] && (( number > highest )); then
                highest="${number}"
              fi
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100"               --jq '.[].tag_name'
          )

          version=$((highest + 1))
          tag="${TAG_PREFIX}${version}"
          release_date=$(date -u +%Y.%m.%d)

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if (( highest > 0 )); then
            echo "previous-tag=${TAG_PREFIX}${highest}" >> "${GITHUB_OUTPUT}"
          else
            echo "previous-tag=" >> "${GITHUB_OUTPUT}"
          fi
          echo "date=${release_date}" >> "${GITHUB_OUTPUT}"

      - name: Build
        shell: bash
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
          GRADLE_ARGUMENTS: ${{ inputs.gradle-arguments }}
          RELEASE_ENABLED: ${{ steps.release-version.outputs.enabled }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_DATE: ${{ steps.release-version.outputs.date }}
        run: |
          set -euo pipefail
          version_arguments=()
          if [[ "${RELEASE_ENABLED}" == "true" ]]; then
            version_arguments=("-Pversion=${RELEASE_DATE}-b${RELEASE_VERSION}" "-PbuildDate=${RELEASE_DATE}")
          fi
          ./gradlew ${GRADLE_TASK} ${GRADLE_ARGUMENTS} "${version_arguments[@]}"

      - name: Resolve artifact name
        if: ${{ inputs.artifact-path != '' && github.event_name != 'pull_request' }}
        id: artifact
        shell: bash
        env:
          EXPLICIT_NAME: ${{ inputs.artifact-name }}
          PROJECT_NAME: ${{ inputs.project-name }}
          SHA: ${{ github.sha }}
          RELEASE_ENABLED: ${{ steps.release-version.outputs.enabled }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_DATE: ${{ steps.release-version.outputs.date }}
        run: |
          if [[ -n "${EXPLICIT_NAME}" ]]; then
            name="${EXPLICIT_NAME}"
          elif [[ "${RELEASE_ENABLED}" == "true" ]]; then
            name="${PROJECT_NAME}-${RELEASE_DATE}-b${RELEASE_VERSION}"
          else
            name="${PROJECT_NAME}-${SHA:0:7}"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        if: ${{ inputs.artifact-path != '' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ steps.release-version.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_DATE: ${{ steps.release-version.outputs.date }}
          PREVIOUS_TAG: ${{ steps.release-version.outputs.previous-tag }}
          EXPLICIT_RELEASE_ASSETS: ${{ inputs.release-assets }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          PROJECT_NAME: ${{ inputs.project-name }}
        run: |
          set -euo pipefail

          patterns="${EXPLICIT_RELEASE_ASSETS}"
          if [[ -z "${patterns}" ]]; then
            patterns="${ARTIFACT_PATH}"
          fi

          assets=()
          if [[ -n "${patterns}" ]]; then
            while IFS= read -r pattern; do
              [[ -z "${pattern}" ]] && continue
              while IFS= read -r file; do
                [[ -n "${file}" ]] && assets+=("${file}")
              done < <(compgen -G "${pattern}" || true)
            done <<< "${patterns}"
          fi

          if [[ -n "${patterns}" && ${#assets[@]} -eq 0 ]]; then
            echo "::error::No release asset matched the configured path(s)."
            exit 1
          fi

          jar_assets=()
          for asset in "${assets[@]}"; do
            if [[ "${asset}" == *.jar ]]; then
              jar_assets+=("${asset}")
            fi
          done

          if [[ ${#jar_assets[@]} -gt 0 ]]; then
            fixed_asset_dir="${RUNNER_TEMP}/fixed-release-assets"
            fixed_asset="${fixed_asset_dir}/${PROJECT_NAME}.jar"
            mkdir -p "${fixed_asset_dir}"
            cp "${jar_assets[0]}" "${fixed_asset}"
            release_assets=()
            for asset in "${assets[@]}"; do
              if [[ "${asset}" != *.jar ]]; then
                release_assets+=("${asset}")
              fi
            done
            release_assets+=("${fixed_asset}")
            assets=("${release_assets[@]}")
          fi

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            changelog_range="${PREVIOUS_TAG}..${GITHUB_SHA}"
            changelog_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
          else
            changelog_range="${GITHUB_SHA}"
            changelog_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          fi

          commits=$(git log --no-merges --format='- %s (%h)' "${changelog_range}")
          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            printf '## Changes\n\n'
            if [[ -n "${commits}" ]]; then
              printf '%s\n' "${commits}"
            else
              printf 'No source changes since %s.\n' "${PREVIOUS_TAG}"
            fi
            printf '\n**Full Changelog**: %s\n' "${changelog_url}"
          } > "${notes_file}"

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_DATE}-b${RELEASE_VERSION}" \
            --notes-file "${notes_file}" \
            --latest
